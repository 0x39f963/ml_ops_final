# Generated at: 2026-06-01 13:00:25 MSK

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/nbo_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: nbo-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - nbo-api:8000
