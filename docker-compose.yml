services:
  mlflow:
    image: python:3.12-slim
    container_name: ml005_mlflow
    command: >
      /bin/sh -lc "
      pip install --no-cache-dir mlflow==2.22.5 &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --host 0.0.0.0
      --port 5000"
    ports:
      - "${MLFLOW_PORT:-15000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  nbo-api:
    build: .
    container_name: nbo-api
    command: uvicorn src.serve_api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-nbo_topn}
      FEATURE_STORE_DIR: ${FEATURE_STORE_DIR:-data/feature_store}
      MODEL_DIR: ${MODEL_DIR:-/app/models}
      TOP_N: ${TOP_N:-10}
      DATA_CUTOFF: ${DATA_CUTOFF:-}
      SCORE_DECISION_THRESHOLD: ${SCORE_DECISION_THRESHOLD:-0.5}
      MODEL_REFRESH_ON_REQUEST: ${MODEL_REFRESH_ON_REQUEST:-false}
    ports:
      - "${API_PORT:-18000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # b08 monitoring
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ml005_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "${PROM_PORT:-9090}:9090"
    depends_on:
      - nbo-api
      - node-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ml005_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ml005_node_exporter
    command:
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - ./reports/prometheus:/var/lib/node_exporter/textfile_collector:ro

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
